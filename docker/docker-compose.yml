version: '3.9'
name: pytamaro-web
services:
  nextjs:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    restart: always
    depends_on:
      - postgres
    environment:
      - VIRTUAL_HOST=${NEXT_PUBLIC_DOMAIN}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/migrations:/migrations
  nginx-proxy:
    build:
      context: ..
      dockerfile: docker/nginx-proxy/Dockerfile
    restart: always
    ports:
      - '9009:9009'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    environment:
      - HTTP_PORT=9009
volumes:
  db:
    driver: local
