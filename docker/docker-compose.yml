version: "3.9"
services:
  pytamaro-web-nextjs:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    ports:
      - "9009:3000"
    depends_on:
      - pytamaro-web-redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  pytamaro-web-redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
