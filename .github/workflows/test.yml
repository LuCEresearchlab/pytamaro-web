name: End-to-end tests
on:
  push:
    branches: [ main, test_glot ]
  pull_request:
    branches: [ main ]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          token: ${{ secrets.PYTAMARO_WEB_TOKEN }}
      - name: Glot
        run: docker pull glot/docker-run:latest &&
             source .env &&
             docker pull $GLOT_IMAGE_TAG && 
             docker run --detach --restart=always --publish 8088:8088 --volume /var/run/docker.sock:/var/run/docker.sock --env "API_ACCESS_TOKEN=token" glot/docker-run:latest
      # Install NPM dependencies, cache them correctly,
      # build, start local server
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          build: npm run build
          start: npm start
