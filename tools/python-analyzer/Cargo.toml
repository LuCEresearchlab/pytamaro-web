[package]
name = "python-analyzer"
description = "A WebAssembly-based Python code analyzer powered by Ruff."
repository = "https://github.com/LuCEresearchlab/pytamaro-web"
authors = ["Luca Chiodini <luca@chiodini.org>"]
version = "0.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7" }
console_log = { version = "1.0.0" }
log = { version = "0.4.17" }
wasm-bindgen = { version = "0.2.117", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

# From https://github.com/astral-sh/ruff/blob/main/crates/ty_wasm/Cargo.toml and https://github.com/astral-sh/ruff/blob/main/Cargo.toml
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ruff_db = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15", default-features = false, features = [] }
ty_ide = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ty_project = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15", default-features = false, features = [
    "deflate",
] }
ty_python_core = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", tag = "0.15.15" }

js-sys = { version = "0.3.77" }
zip = {version = "5.1.1", default-features = false, features = ["deflate"] }
web-sys = { version = "0.3", features = ["console"] }
# Not a direct dependency but required to compile for Wasm.
uuid = { version = "1.6.1", features = ["v4", "fast-rng", "macro-diagnostics", "js"] }
# Not a direct dependency but required to enable the `wasm_js` feature.
# See https://docs.rs/getrandom/latest/getrandom/#webassembly-support
getrandom = { version="0.4.1", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.67"

# See https://github.com/astral-sh/ruff/blob/main/Cargo.toml
[profile.release]
strip = true
lto = "fat"
codegen-units = 1

# -Oz optimizes "aggressively for size" (https://docs.rs/wasm-opt/latest/wasm_opt/struct.OptimizationOptions.html#method.new_optimize_for_size_aggressively)
# For the last two options, see https://github.com/drager/wasm-pack/issues/1441#issuecomment-2886461752
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
