[package]
name = "python-analyzer"
description = "A WebAssembly-based Python code analyzer powered by Ruff."
repository = "https://github.com/LuCEresearchlab/pytamaro-web"
authors = ["Luca Chiodini <luca@chiodini.org>"]
version = "0.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = { version = "0.2.105", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff"}
ruff_python_parser = { git = "https://github.com/astral-sh/ruff"}
ruff_text_size = { git = "https://github.com/astral-sh/ruff"}
ruff_source_file = { git = "https://github.com/astral-sh/ruff"}
ruff_notebook = { git = "https://github.com/astral-sh/ruff" }
ruff_python_formatter = { git = "https://github.com/astral-sh/ruff" }
ruff_db = { git = "https://github.com/astral-sh/ruff", default-features = false, features = [] }
ty_ide = { git = "https://github.com/astral-sh/ruff" }
ty_project = { git = "https://github.com/astral-sh/ruff", default-features = false, features = [
    "deflate",
    "format"
] }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff" }
js-sys = { version = "0.3.77" }
zip = {version = "5.1.1", default-features = false, features = ["deflate"] }
web-sys = { version = "0.3", features = ["console"] }
# Not a direct dependency but required to compile for Wasm.
uuid = { version = "1.6.1", features = ["v4", "fast-rng", "macro-diagnostics", "js"] }
# Not a direct dependency but required to enable the `wasm_js` feature.
# See https://docs.rs/getrandom/latest/getrandom/#webassembly-support
getrandom = { version="0.3.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.43"

[profile.release]
strip = true

# See https://github.com/drager/wasm-pack/issues/1441#issuecomment-2886461752
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
