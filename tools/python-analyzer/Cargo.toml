[package]
name = "python-analyzer"
description = "A WebAssembly-based Python code analyzer powered by Ruff."
repository = "https://github.com/LuCEresearchlab/pytamaro-web"
authors = ["Luca Chiodini <luca@chiodini.org>"]
version = "0.0.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7" }
console_log = { version = "1.0.0" }
log = { version = "0.4.33" }
wasm-bindgen = { version = "0.2.129", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0"

# From https://github.com/astral-sh/ruff/blob/main/crates/ty_wasm/Cargo.toml and https://github.com/astral-sh/ruff/blob/main/Cargo.toml
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_ranged_value = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_notebook = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ruff_db = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1", default-features = false, features = [] }
ty_ide = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ty_project = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1", default-features = false, features = [
    "deflate",
] }
ty_python_core = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", tag = "0.17.1" }

js-sys = { version = "0.3.77" }
zip = {version = "8.6.0", default-features = false, features = ["deflate"] }
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.77"

# See https://github.com/astral-sh/ruff/blob/main/Cargo.toml
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "s"  # ask rustc to optimize for size (https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level)

# -Oz optimizes "aggressively for size" (https://docs.rs/wasm-opt/latest/wasm_opt/struct.OptimizationOptions.html#method.new_optimize_for_size_aggressively)
# For the last two options, see https://github.com/drager/wasm-pack/issues/1441#issuecomment-2886461752
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
